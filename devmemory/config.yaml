name: DevMemory
version: '0.4.2'
slug: devmemory
stage: experimental
description: Local-first development memory with project journal and full-text search
url: https://github.com/vorlocsev/devmemory
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:database-search
panel_title: DevMemory
panel_admin: true
ports:
  8100/tcp: null
ports_description:
  8100/tcp: Optional HTTPS MCP agent endpoint (disabled by default)
map:
  - type: app_config
    read_only: true
options:
  github_token: ''
  mcp_enabled: false
  mcp_token: ''
  mcp_projects: ''
  mcp_host: ''
  mcp_allow_write: false
schema:
  github_token: password?
  mcp_enabled: bool
  mcp_token: password?
  mcp_projects: str?
  mcp_host: str?
  mcp_allow_write: bool
