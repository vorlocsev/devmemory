name: DevMemory CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s devmemory/tests -v
      - run: node --check devmemory/app.js
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: devmemory
          platforms: ${{ matrix.platform }}
          build-args: BUILD_ARCH=${{ matrix.arch }}
          push: false
          load: true
          tags: devmemory-smoke:local
      - name: Runtime smoke test
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          name=devmemory-smoke
          trap 'docker logs "$name" || true; docker rm -f "$name" || true' EXIT
          docker run -d --name "$name" --platform "$PLATFORM" -e DEVMEMORY_MODE=standalone -e DEVMEMORY_TOKEN=smoke-test-only-not-a-real-secret-0000 devmemory-smoke:local
          docker exec "$name" python -c "import time,urllib.request; time.sleep(2); assert urllib.request.urlopen('http://127.0.0.1:8099/health',timeout=10).status==200; r=urllib.request.Request('http://127.0.0.1:8099/api/projects',headers={'Authorization':'Bearer smoke-test-only-not-a-real-secret-0000'}); assert urllib.request.urlopen(r,timeout=10).read()==b'[]'"
          docker stop -t 15 "$name"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$name")" = 0
