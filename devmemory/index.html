<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevMemory</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body><header><h1>DevMemory</h1><p>Project memory / Память проектов</p></header><main><section><label>API token (standalone only)<input id="token" type="password" autocomplete="off"></label><button id="connect">Connect / Подключить</button><p id="status" role="status"></p></section><section><h2>Проекты / Projects</h2><form id="projectForm"><label>ID<input name="slug" required pattern="[a-z0-9][a-z0-9_-]{0,63}"></label><label>Название<input name="name" required maxlength="160"></label><button>Добавить проект</button></form><label>Проект<select id="project"></select></label></section><section><h2>Новая запись / New entry</h2><form id="entryForm"><label>Тип<select name="kind"><option>note</option><option>decision</option><option>evidence</option><option>blocker</option><option>plan</option><option>lesson</option></select></label><label>Статус<select name="status"><option>reported</option><option>proposed</option><option>unknown</option><option>verified</option></select></label><label>Заголовок<input name="title" required maxlength="240"></label><label>Текст<textarea name="body" required maxlength="50000"></textarea></label><label>Источник<input name="source" maxlength="2000"></label><label>Commit SHA<input name="sha" maxlength="40"></label><button>Сохранить</button></form></section><section><h2>Журнал / Journal</h2><label>Поиск<input id="query" maxlength="500"></label><div class="actions"><button id="search">Поиск</button><button id="export">Экспорт контекста</button><button id="prev">Назад</button><button id="next">Далее</button></div><div id="entries"></div></section></main></body></html>
